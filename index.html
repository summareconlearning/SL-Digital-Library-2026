        }

        document.getElementById('btn-next-page').addEventListener('click', () => {
            const pages = currentModuleData.pages || [];
            const totalSpreads = 1 + Math.ceil((pages.length - 1) / 2);
            if (isFlipping || currentSpreadIndex >= totalSpreads - 1) return;
            
            isFlipping = true; SoundEngine.play('paperWoosh');
            const nextSpread = currentSpreadIndex + 1;

            let currRightData = pages[currentSpreadIndex === 0 ? 0 : currentSpreadIndex * 2];
            let nextLeftData = pages[nextSpread * 2 - 1];
            let nextRightData = pages[nextSpread * 2];

            const turner = document.getElementById('modal-page-turner');
            document.querySelector('#modal-page-turner .page-front').innerHTML = generatePageHTML(currRightData, 'dynamic', 'right');
            document.querySelector('#modal-page-turner .page-back').innerHTML = generatePageHTML(nextLeftData, 'dynamic', 'left');

            gsap.set(turner, { z: 10, visibility: 'visible', rotationY: 0 });
            document.querySelector('#modal-static-right .page-front').innerHTML = generatePageHTML(nextRightData, 'dynamic', 'right');

            gsap.to(turner, {
                rotationY: -180, z: 10, duration: 0.6, ease: "power2.inOut",
                onComplete: () => {
                    document.querySelector('#modal-flipper-main .page-back').innerHTML = generatePageHTML(nextLeftData, 'dynamic', 'left');
                    gsap.set(turner, { visibility: 'hidden', rotationY: 0 });
                    currentSpreadIndex = nextSpread;
                    updateBookSpreadDOM(currentSpreadIndex);
                    isFlipping = false;
                }
            });
        });

        document.getElementById('btn-prev-page').addEventListener('click', () => {
            if (isFlipping || currentSpreadIndex <= 0) return;
            
            isFlipping = true; SoundEngine.play('paperWoosh');
            const prevSpread = currentSpreadIndex - 1;
            const pages = currentModuleData.pages || [];

            let currLeftData = pages[currentSpreadIndex * 2 - 1];
            let prevLeftData = prevSpread === 0 ? currentModuleData : pages[prevSpread * 2 - 1];
            let prevLeftType = prevSpread === 0 ? 'cover' : 'dynamic';
            let prevRightData = pages[prevSpread === 0 ? 0 : prevSpread * 2];

            const turner = document.getElementById('modal-page-turner');
            document.querySelector('#modal-page-turner .page-back').innerHTML = generatePageHTML(currLeftData, 'dynamic', 'left');
            document.querySelector('#modal-page-turner .page-front').innerHTML = generatePageHTML(prevRightData, 'dynamic', 'right');

            gsap.set(turner, { z: 10, visibility: 'visible', rotationY: -180 });
            document.querySelector('#modal-flipper-main .page-back').innerHTML = generatePageHTML(prevLeftData, prevLeftType, 'left');

            gsap.to(turner, {
                rotationY: 0, z: 10, duration: 0.6, ease: "power2.inOut",
                onComplete: () => {
                    document.querySelector('#modal-static-right .page-front').innerHTML = generatePageHTML(prevRightData, 'dynamic', 'right');
                    gsap.set(turner, { visibility: 'hidden', rotationY: 0 });
                    currentSpreadIndex = prevSpread;
                    updateBookSpreadDOM(currentSpreadIndex);
                    isFlipping = false;
                }
            });
        });

        function getModalScale() {
            const DESIGN_W = 1100, DESIGN_H = 688;
            const availW = window.innerWidth * 0.92, availH = window.innerHeight * 0.90;
            return Math.min(1, availW / DESIGN_W, availH / DESIGN_H);
        }

        function openModal(moduleData) {
            if(currentState !== 'level3') return;

            if (isMobile()) {
                openMobileModal(moduleData);
                return;
            }
            
            currentModuleData = moduleData;
            currentSpreadIndex = 0;
            document.getElementById('modal-cover-front').style.backgroundImage = `url('${moduleData.coverImg}')`;
            
            updateBookSpreadDOM(0);

            gsap.set('#modal-page-turner', { z: 5, rotationY: 0, visibility: 'hidden' });
            gsap.set('#modal-cover', { z: 4, rotationY: 0 }); 
            gsap.set('#modal-flipper-1', { z: 3, rotationY: 0 }); 
            gsap.set('#modal-flipper-2', { z: 2, rotationY: 0 }); 
            gsap.set('#modal-flipper-main', { z: 1, rotationY: 0 }); 
            gsap.set('#modal-static-right', { z: 0, rotationY: 0 });
            
            const finalScale = getModalScale();
            
            modalTimeline = gsap.timeline({ onComplete: () => { currentState = 'modal'; }});
            
            modalTimeline.to('#stage-shelf', { x: -50, opacity: 0, duration: 0.5, ease: "power3.inOut" })
                         .set('#stage-modal', { visibility: 'visible' }).to('#stage-modal', { opacity: 1, duration: 0.3 }, "<")
                         .fromTo('.book-modal-wrapper', { scale: 0.6 * finalScale, opacity: 0, y: 50 }, { scale: finalScale, opacity: 1, y: 0, duration: 0.7, ease: "back.out(1.2)" })
                         .to('#modal-cover', { rotationY: -180, z: 0, duration: 0.8, ease: "power2.inOut", onStart: () => SoundEngine.play('paperWoosh') }, "-=0.2")
                         .to('#modal-flipper-1', { rotationY: -180, z: 1, duration: 0.5, ease: "power2.inOut", onStart: () => SoundEngine.play('paperWoosh') }, "-=0.5")
                         .to('#modal-flipper-2', { rotationY: -180, z: 2, duration: 0.5, ease: "power2.inOut", onStart: () => SoundEngine.play('paperWoosh') }, "-=0.35")
                         .to('#modal-flipper-main', { rotationY: -180, z: 3, duration: 0.6, ease: "power2.out", onStart: () => SoundEngine.play('paperWoosh') }, "-=0.35")
                         .fromTo('#close-modal', { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.3 }, "-=0.2");
        }

        document.getElementById('close-modal').addEventListener('mouseenter', () => SoundEngine.play('hover'));
        document.getElementById('close-modal').addEventListener('click', () => {
            if (isMobile() && currentState === 'modal') { closeMobileModal(); return; }
            if (modalTimeline && currentState === 'modal') {
                SoundEngine.play('paperWoosh'); currentState = 'animating'; 
                gsap.to(['#btn-prev-page', '#btn-next-page', '#close-modal'], { autoAlpha: 0, duration: 0.2 }); 
                modalTimeline.reverse().eventCallback("onReverseComplete", () => { currentState = 'level3'; gsap.set('#stage-modal', { visibility: 'hidden' }); });
            }
        });

        window.addEventListener('resize', () => {
            if (currentState === 'modal' && !isMobile()) {
                gsap.set('.book-modal-wrapper', { scale: getModalScale() });
            }
        });

        backBtn.addEventListener('mouseenter', () => SoundEngine.play('hover'));
        backBtn.addEventListener('click', () => {
            if (currentState === 'modal') {
                if (isMobile()) { closeMobileModal(); }
                else { document.getElementById('close-modal').click(); }
            }
            else if (currentState === 'level3') {
                const tl = gsap.timeline({ onComplete: () => { currentState = 'level2'; activeSubcategory = null; }});
                if (isMobile()) {
                    dismissMobileTooltip();
                    tl.to('.bookcase-layout', { opacity: 0, y: 30, duration: 0.4, ease: "power3.in", onStart: () => SoundEngine.play('heavyWoosh') }).add(() => {
                        layoutContainer.classList.remove('centered-layout'); hugeTitle.style.display = 'block'; hugeTitle.innerText = libraryData[activeCategory].mainTitle; gsap.set(container, { clearProps: 'all' }); renderBooks(libraryData[activeCategory].subcategories, 'stack');
                        gsap.fromTo('.huge-title', { opacity: 0 }, { opacity: 1, duration: 0.3 });
                        gsap.fromTo('.render-item', { x: 60, opacity: 0 }, { x: 0, opacity: 1, duration: 0.4, stagger: 0.06 });
                    });
                } else {
                    tl.to('.bookcase-layout', { y: window.innerHeight, duration: 0.8, ease: "power3.in", onStart: () => SoundEngine.play('heavyWoosh') }).add(() => { layoutContainer.classList.remove('centered-layout'); hugeTitle.style.display = 'block'; hugeTitle.innerText = libraryData[activeCategory].mainTitle; gsap.set(container, { clearProps: 'all' }); renderBooks(libraryData[activeCategory].subcategories, 'stack'); const tl2 = gsap.timeline(); tl2.to('.huge-title', { opacity: 1, x: 0, duration: 0.3 }).fromTo('#shelf-floor-level2', { opacity: 0, scaleY: 0 }, { opacity: 1, scaleY: 1, duration: 0.3 }, "<").fromTo('.render-item', { y: -800, x: 0, opacity: 0, rotation: 0 }, { y: 0, opacity: 1, x: (i) => libraryData[activeCategory].subcategories[i].offsetX || 0, rotation: (i) => libraryData[activeCategory].subcategories[i].angle || 0, duration: 0.8, ease: "bounce.out", stagger: 0.15 }, "<"); });
                }
            }
            else if (currentState === 'level2') {
                const tl = gsap.timeline({ onComplete: () => { currentState = 'home'; activeCategory = null; }});
                if (isMobile()) {
                    tl.to('.render-item', { x: 60, opacity: 0, duration: 0.3, stagger: 0.04, ease: "power2.in" })
                      .to('.huge-title', { opacity: 0, x: -30, duration: 0.3 }, "<")
                      .to(backBtn, { autoAlpha: 0, pointerEvents: 'none', duration: 0.2 }, "<")
                      .set('#stage-shelf', { visibility: 'hidden' })
                      .set('#stage-home', { visibility: 'visible' })
                      .to('#cloud-container', { opacity: 1, duration: 0.6 }, "<")
                      .fromTo('.big-book-wrapper', { y: -200, opacity: 0 }, { y: 0, opacity: 1, duration: 0.7, ease: "power3.out", stagger: 0.1 }, "<")
                      .to('#info-btn', { opacity: 1, scale: 1, duration: 0.3, pointerEvents: 'all' }, "-=0.3")
                      .to('#main-back-btn', { opacity: 1, duration: 0.3, pointerEvents: 'all' }, "-=0.3");
                } else {
                    tl.to('.render-item', { y: 600, opacity: 0, duration: 0.4, stagger: 0.05, ease: "power2.in" }).to(['.huge-title', '#shelf-floor-level2'], { opacity: 0, x: -50, duration: 0.4 }, "<").to(backBtn, { autoAlpha: 0, pointerEvents: 'none', duration: 0.2 }, "<").set('#stage-shelf', { visibility: 'hidden' }).set('#stage-home', { visibility: 'visible' }).to('#cloud-container', { opacity: 1, duration: 0.8 }, "<").to('.big-book-wrapper', { x: 0, opacity: 1, duration: 0.8, ease: "power3.out" }, "<")
                      .to('#info-btn', { opacity: 1, scale: 1, duration: 0.3, pointerEvents: 'all' }, "-=0.3")
                      .to('#main-back-btn', { opacity: 1, duration: 0.3, pointerEvents: 'all' }, "-=0.3");
                }
            }
        });

        /* =============================================
           SHELF ZOOM CONTROLS (Level 3 only)
           Zoom preference is saved per device type in localStorage.
           Key: "shelfZoom_desktop" | "shelfZoom_tablet" | "shelfZoom_mobile"
           ============================================= */
        const MIN_SCALE = 0.4;
        const MAX_SCALE = 1.5;
        const zoomControls = document.getElementById('shelf-zoom-controls');
        const zoomLabel = document.getElementById('zoom-level-label');

        function getZoomStorageKey() {
            const w = window.innerWidth;
            if (w <= 768)  return 'shelfZoom_mobile';
            if (w <= 1200) return 'shelfZoom_tablet';
            return 'shelfZoom_desktop';
        }

        function loadSavedZoom() {
            const key = getZoomStorageKey();
            const saved = parseFloat(localStorage.getItem(key));
            if (!isNaN(saved) && saved >= MIN_SCALE && saved <= MAX_SCALE) return saved;
            return 1.0; /* default */
        }

        function saveZoom(scale) {
            try { localStorage.setItem(getZoomStorageKey(), scale); } catch(e) {}
        }

        let shelfScale = loadSavedZoom();

        function applyZoom() {
            const bc = document.querySelector('.bookcase-layout');
            if (bc) {
                bc.style.transform = 'scale(' + shelfScale + ')';
                bc.style.transformOrigin = 'center center';
            }
            zoomLabel.textContent = Math.round(shelfScale * 100) + '%';
        }

        function shelfZoom(delta) {
            shelfScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, shelfScale + delta));
            applyZoom();
            saveZoom(shelfScale);
        }

        function showZoomControls() {
            if (!isMobile()) {
                zoomControls.style.display = 'flex';
                /* Label stays in sync — scale was already applied at render time */
                zoomLabel.textContent = Math.round(shelfScale * 100) + '%';
            }
        }
        function hideZoomControls() {
            zoomControls.style.display = 'none';
            /* Do NOT clear the bookcase transform here — GSAP's exit animation
               only moves y/opacity, so clearing scale would cause a visible snap.
               The transform is naturally gone when renderBooks replaces the DOM node. */
        }

        /* Watch currentState changes */
        const zoomStateObserver = setInterval(() => {
            if (currentState === 'level3') showZoomControls();
            else hideZoomControls();
        }, 200);
    </script>
</body>
</html>
